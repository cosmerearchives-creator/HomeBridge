name: Android and Quest APK
on:
  push:
    branches: [main, 'codex/**']
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test and build Android APK
        working-directory: android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HomeBridge-Android-Preview
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HomeBridge-Android-Preview
      - name: Publish sideload preview
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv app-debug.apk HomeBridge-Android.apk
          tag="android-preview-$GITHUB_RUN_NUMBER"
          gh release create "$tag" HomeBridge-Android.apk --target "$GITHUB_SHA" --prerelease --latest=false --title "HomeBridge Android Preview $GITHUB_RUN_NUMBER" --notes "Sideload preview for Android and Meta Quest. Includes an SMB file explorer and a Quest panel layout. Debug signing is specific to this build, so remove a previous preview before installing if the device reports a signing mismatch."
