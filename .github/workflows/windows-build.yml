name: Windows installer
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Validate release tag matches installer and desktop versions
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/HomeBridge.Desktop/HomeBridge.Desktop.csproj)).Project.PropertyGroup.Version
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw 'Release tag does not match application version' }
          if (!(Select-String -LiteralPath installer/HomeBridge.iss -SimpleMatch ('#define MyAppVersion "' + $version + '"'))) { throw 'Installer version does not match application' }
      - name: Restore
        run: dotnet restore HomeBridge.slnx
      - name: Build
        run: dotnet build HomeBridge.slnx -c Release --no-restore
      - name: Test updates, persistence, authentication and rename regression
        run: dotnet test tests/HomeBridge.Tests/HomeBridge.Tests.csproj -c Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory TestResults
      - name: Publish standalone executable
        run: dotnet publish src/HomeBridge.Desktop/HomeBridge.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o publish
      - name: Publish optional LocalService worker
        run: dotnet publish src/HomeBridge.Service/HomeBridge.Service.csproj -c Release -r win-x64 --self-contained true -o publish/service
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Create installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer\HomeBridge.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify service install, least privilege, status, upgrade and uninstall
        shell: pwsh
        run: ./tests/Service-Smoke.ps1
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: HomeBridge-Test-Results
          path: TestResults/*.trx
          if-no-files-found: ignore
      - name: Upload installer artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: HomeBridge-Windows-Installer
          path: artifacts/HomeBridge-Setup.exe
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: HomeBridge-Windows-Installer
          path: installer
      - name: Publish verified installer as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          args=()
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$RELEASE_TAG" installer/HomeBridge-Setup.exe --verify-tag --title "HomeBridge $RELEASE_TAG" --generate-notes "${args[@]}"
