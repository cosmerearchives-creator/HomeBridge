name: Windows installer
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore HomeBridge.slnx
      - name: Build
        run: dotnet build HomeBridge.slnx -c Release --no-restore
      - name: Publish standalone executable
        run: dotnet publish src/HomeBridge.Desktop/HomeBridge.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o publish
      - name: Publish background service
        run: dotnet publish src/HomeBridge.Service/HomeBridge.Service.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o publish-service
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Create installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer\HomeBridge.iss"
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeBridge-Windows-Installer
          path: artifacts/HomeBridge-Setup.exe

      - name: Publish rolling preview release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "native-preview"
          $asset = "artifacts/HomeBridge-Setup.exe"
          if (-not (Test-Path $asset)) { throw "Installer missing: $asset" }
          $notes = "Experimental .NET 10 Windows build from commit $env:GITHUB_SHA. This is not feature-complete and does not auto-update yet. The native build currently includes local Bulk Rename, local Application Launcher, persistent settings, and LAN discovery service."
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $asset --repo $env:GITHUB_REPOSITORY --title "HomeBridge Native Preview" --notes $notes --prerelease --target $env:GITHUB_SHA
          } else {
            gh release upload $tag $asset --repo $env:GITHUB_REPOSITORY --clobber
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --notes $notes --prerelease
          }
