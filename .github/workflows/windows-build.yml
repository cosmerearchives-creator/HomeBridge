name: Windows installer
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Set published version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/HomeBridge.Desktop/HomeBridge.Desktop.csproj)).Project.PropertyGroup.Version
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            if ($env:GITHUB_REF_NAME -cne "v$version") { throw 'Tag must match desktop version' }
          } elseif ($env:GITHUB_REF -eq 'refs/heads/main') {
            $version = "1.0.0-preview.$env:GITHUB_RUN_NUMBER"
          }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
      - name: Restore
        run: dotnet restore HomeBridge.slnx
      - name: Build
        run: dotnet build HomeBridge.slnx -c Release --no-restore
      - name: Test secure updater
        run: dotnet test tests/HomeBridge.Tests/HomeBridge.Tests.csproj -c Release --no-build
      - name: Publish standalone executable
        run: dotnet publish src/HomeBridge.Desktop/HomeBridge.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o publish -p:Version=${{ env.APP_VERSION }}
      - name: Publish background service
        run: dotnet publish src/HomeBridge.Service/HomeBridge.Service.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o publish-service
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Create installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:APP_VERSION" "installer\HomeBridge.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed" }
          $file = Get-Item artifacts/HomeBridge-Setup.exe
          @{ version=$env:APP_VERSION; commit=$env:GITHUB_SHA; sha256=(Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant(); size=$file.Length; asset=$file.Name } | ConvertTo-Json | Set-Content artifacts/update.json -Encoding utf8
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeBridge-Windows-Installer
          path: artifacts/*
          if-no-files-found: error
  release:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HomeBridge-Windows-Installer
          path: artifacts
      - name: Publish complete versioned release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(jq -r .version artifacts/update.json)
          tag="v$version"
          args=()
          if [[ "$version" == *-* ]]; then args+=(--prerelease); fi
          # A draft keeps the updater from seeing an incomplete set of assets.
          gh release create "$tag" artifacts/HomeBridge-Setup.exe artifacts/update.json --draft --target "$GITHUB_SHA" --title "HomeBridge $version" --notes "Native .NET 10 build $GITHUB_SHA. Includes verified in-app updates. See README for preview limitations." "${args[@]}"
          gh release edit "$tag" --draft=false

      - name: Refresh permanent Windows installer download
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # Never let a slower older build replace the newest download.
          current=$(gh api "repos/$GH_REPO/commits/main" --jq .sha)
          if [[ "$current" != "$GITHUB_SHA" ]]; then exit 0; fi
          version=$(jq -r .version artifacts/update.json)
          notes="Download HomeBridge-Setup.exe below, run it, then open HomeBridge from Start. This installer includes .NET 10 and in-app update checks. Current version: $version. Versioned release: https://github.com/$GH_REPO/releases/tag/v$version . This is an unsigned Windows preview."
          if gh release view native-preview >/dev/null 2>&1; then
            gh release upload native-preview artifacts/HomeBridge-Setup.exe artifacts/update.json --clobber
            gh release edit native-preview --title "HomeBridge for Windows — Download installer" --notes "$notes" --prerelease
          else
            gh release create native-preview artifacts/HomeBridge-Setup.exe artifacts/update.json --target "$GITHUB_SHA" --title "HomeBridge for Windows — Download installer" --notes "$notes" --prerelease
          fi
