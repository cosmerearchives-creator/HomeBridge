plugins { id 'com.android.application' version '8.7.3' }

android {
    namespace 'com.cosmerearchives.homebridge'
    compileSdk 35
    defaultConfig {
        applicationId 'com.cosmerearchives.homebridge'
        minSdk 29
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('GITHUB_RUN_NUMBER') ?: '1')
        versionName '0.1.' + (System.getenv('GITHUB_RUN_NUMBER') ?: '1')
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging.resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation 'eu.agno3.jcifs:jcifs-ng:2.1.10'
    testImplementation 'junit:junit:4.13.2'
}
